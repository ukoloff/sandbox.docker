name: syncThing

services:
  A: &service
    image: lscr.io/linuxserver/syncthing:latest
    restart: unless-stopped
    ports:
      - 8887:8384
    volumes:
      - vA:/sync/A
      - vB:/sync/B
      - vC:/sync/C

  B:
    <<: *service
    ports:
      - 8888:8384

  C:
    <<: *service
    ports:
      - 8889:8384

volumes:
  vA:
  vB:
  vC:
