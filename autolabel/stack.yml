# For docker stack
services:
  daemon:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - config:/config
    command:
      - sh
      - /bin/monitor.sh

volumes:
  config:
