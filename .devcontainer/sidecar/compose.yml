name: sidecar-test

services:
  node:
    image: node:lts-alpine
    volumes:
      - type: tmpfs
        target: /var/cache/apk
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    working_dir: /repo
    init: true
    command:
      - sleep
      - infinity
