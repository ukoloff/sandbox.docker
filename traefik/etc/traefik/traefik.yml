global:
  checkNewVersion: true
  sendAnonymousUsage: false

entryPoints:
  web:
    address: :80

  traefik:
    address: :8080

  tls:
    address: :443

api:
  insecure: true
  dashboard: true

providers:
  docker:
    exposedByDefault: false

  file:
    directory: /etc/traefik/conf.d/

  # swarm:
  #   exposedByDefault: false

log:
  level: INFO

certificatesResolvers:
  le:
    acme:
      email: stas@ekb.ru
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      storage: /letsenrypt/acme.json
      keyType: EC384
      dnsChallenge:
        provider: httpreq
        # resolvers:
        #   - 8.8.8.8
        propagation:
          delayBeforeChecks: 108
          disableChecks: true
