global:
  checkNewVersion: true
  sendAnonymousUsage: false

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: tls
          scheme: https
          permanent: true
      middlewares:
        - terry@file

  # traefik:
  #   address: :8080

  tls:
    address: :443
    asDefault: true
    http:
      tls:
        certResolver: le
        domains:
          - main: "*.ekb.ru"
            # sans: ekb.ru
      middlewares:
        - terry@file

api:
  # insecure: true
  dashboard: true
  debug: true
  disableDashboardAd: true

providers:
  docker:
    exposedByDefault: false

  file:
    directory: /etc/traefik/conf.d/

  # swarm:
  #   exposedByDefault: false

log:
  level: INFO

certificatesResolvers:
  le:
    acme:
      email: stas@ekb.ru
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      storage: /letsenrypt/acme.json
      keyType: EC384
      dnsChallenge:
        provider: exec
        # resolvers:
        #   - 8.8.8.8
        propagation:
          delayBeforeChecks: 108
          disableChecks: true
