services:
  itself:
    image: traefik:v3.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: etc
        target: /etc/traefik/traefik.yml
    ports:
      - 80:80
      - 8080:8080

  whoami:
    image: traefik/whoami
    restart: unless-stopped
    labels:
      # traefik.enable: 'true'
      traefik.http.routers.whoami.rule: Host(`whoami.docker.uxm`)
      traefik.http.routers.whoami.entrypoints: web
      traefik.http.services.whoami.loadbalancer.server.port: 80
    deploy:
      labels:
        traefik.enable: 'true'
        traefik.http.routers.whoami.rule: Host(`whoami.swarm.uxm`)
        traefik.http.routers.whoami.entrypoints: web
        traefik.http.services.whoami.loadbalancer.server.port: 80

configs:
  etc:
    file: etc/traefik/traefik.yml
