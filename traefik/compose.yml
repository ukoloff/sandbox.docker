name: traefik

services:
  proxy:
    image: traefik:v3.6
    init: true
    volumes:
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: volume
        source: etc
        target: /etc/traefik
      - type: volume
        source: acme
        target: /letsenrypt/
      - type: image
        source: ukoloff/na01:golang
        target: /na01
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    env_file:
      - .env
    environment:
      EXEC_PATH: /na01/bin/na01
      EXEC_POLLING_INTERVAL: 10
      EXEC_PROPAGATION_TIMEOUT: 300
      NETANGELS_LOGGING: 1

  whoami:
    image: traefik/whoami
    restart: unless-stopped

  netangels:
    profiles:
      - none
    image: ukoloff/na01:golang
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      NETANGELS_LOGGING: 1

volumes:
  etc:
  acme:

networks:
  default:
    name: traefik
    attachable: true
