name: traefik

services:
  itself:
    image: traefik:v3.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - etc:/etc/traefik
    ports:
      - 80:80
      - 8080:8080

  whoami:
    image: traefik/whoami
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.whoami.rule: Host(`whoami.docker.uxm`)
      traefik.http.routers.whoami.entrypoints: web
      traefik.http.services.whoami.loadbalancer.server.port: 80

volumes:
  etc:

networks:
  default:
    name: traefik
    attachable: true
