name: traefik

services:
  proxy:
    image: traefik:v3.6
    depends_on:
      sidecar:
        condition: service_completed_successfully
    init: true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - etc:/etc/traefik
      - acme:/letsenrypt/
      - type: volume
        source: config
        target: /etc/traefik
        volume:
          subpath: traefik/etc/traefik
      - type: image
        source: ukoloff/na01:golang
        target: /bin/na01
        image:
          subpath: bin/na01
    ports:
      - 80:80
      - 443:443
    env_file:
      - .env
    environment:
      EXEC_PATH: na01
      EXEC_POLLING_INTERVAL: 10
      EXEC_PROPAGATION_TIMEOUT: 300
      NETANGELS_LOGGING: 1

  whoami:
    image: traefik/whoami
    restart: unless-stopped

  sidecar:
    image: ukoloff/sidecar:js
    volumes:
      - config:/repo
    working_dir: /repo
    environment:
      SIDECAR_GIT_URL: ukoloff/sandbox.docker/traefik/etc/traefik#traefik

volumes:
  config:
  acme:

networks:
  default:
    name: traefik
    attachable: true
