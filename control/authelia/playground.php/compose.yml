name: Authelia.php

services:
  php:
    image: ukoloff/php56
    restart: unless-stopped
    init: true
    command:
    - php-fpm5.6
    - --nodaemonize
    - --force-stderr
    environment:
      TZ: Asia/Yekaterinburg
      PHP_INI_SCAN_DIR: /etc/php/5.6/fpm/conf.d:/etc/php/5.6/docker/conf.d
    volumes:
      - ./src:/src
      - ./etc/php/5.6/fpm/conf.d:/etc/php/5.6/docker/conf.d
      - ./etc/php/5.6/fpm/pool.d:/etc/php/5.6/fpm/pool.d
    labels:
      dev.dozzle.icon: php

  www:
    image: nginx:latest
    depends_on:
      - php
    restart: unless-stopped
    environment:
      TZ: Asia/Yekaterinburg
    volumes:
      - ./src:/src
      - ./etc/nginx/conf.d:/etc/nginx/conf.d
    labels:
      dev.dozzle.url: http://auth.ekb.ru
      traefik.enable: true
      traefik.http.routers.auth-php.rule: Host(`auth.ekb.ru`)

      # ForwardAuth middleware
      traefik.http.middlewares.authelia.forwardAuth.address: http://www/verify/
      traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: true
      traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: Remote-User,Remote-Groups,Remote-Email,Remote-Name

  observer:
    image: traefik/whoami
    labels:
      traefik.enable: true
      traefik.http.routers.sso-area.rule: Host(`t5k.ekb.ru`) && PathPrefix(`/protected/`)
      traefik.http.routers.sso-area.middlewares: authelia@docker

networks:
  default:
    external: true
    name: traefik
