name: authelia

services:
  authelia:
    image: authelia/authelia:latest
    volumes:
      - ./config:/config
      - data:/data
    labels:
      traefik.enable: true
      traefik.http.routers.authelia.rule: Host(`auth.ekb.ru`)
      # ForwardAuth middleware
      traefik.http.middlewares.authelia.forwardAuth.address: http://authelia:9091/api/authz/forward-auth
      traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: true
      traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: Remote-User,Remote-Groups,Remote-Email,Remote-Name

  whoami:
    image: traefik/whoami
    labels:
      traefik.enable: true
      traefik.http.routers.authelia-whoami.rule: Host(`auth.ekb.ru`) && PathPrefix(`/protected/`)
      traefik.http.routers.authelia-whoami.middlewares: authelia@docker

networks:
  default:
    external: true
    name: traefik

volumes:
  data:
