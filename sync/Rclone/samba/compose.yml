name: rclone-smb

services:
  smb:
    image: rclone/rclone:latest
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    devices:
      - /dev/fuse
    volumes:
      - /mnt/rclone/smb:/mnt:rshared
    env_file:
      - .env
    command:
      - mount
      - :smb:c$/temp
      - /mnt
      - --allow-non-empty
      - --dir-cache-time
      - 1s
