name: rClone

services:
  http:
    image: rclone/rclone:latest
    depends_on:
      sidecar:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: config
        target: /config/rclone
        volume:
          subpath: sync/Rclone/config/http
    command:
      - serve
      - http
      - /etc
      - --addr
      - :80
      - --htpasswd
      - /config/rclone/passwd
    ports:
      - 1488:80

  sftp:
    image: rclone/rclone:latest
    command:
      - serve
      - sftp
      - /etc
      - --addr
      - :22
      - --no-auth
    ports:
      - 1422:22

  mnt88:
    image: rclone/rclone:latest
    depends_on:
      sidecar:
        condition: service_completed_successfully
    # privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    devices:
      - /dev/fuse
    volumes:
      - type: volume
        source: config
        target: /config/rclone
        volume:
          subpath: sync/Rclone/config/mnt88
      - /mnt/rclone/88:/mnt:rshared
    command:
      - mount
      - "serve.http:"
      - /mnt
      - --allow-non-empty

  sh:
    image: alpine
    depends_on:
      - mnt88
    volumes:
      - /mnt/rclone/88:/mnt:rslave
    init: true
    command:
      - sleep
      - infinity

  sidecar:
    image: ukoloff/sidecar:js
    volumes:
      - config:/config
    working_dir: /config
    environment:
      SIDECAR_GIT_URL: ukoloff/sandbox.docker/sync/Rclone/config#rClone

volumes:
  config:
