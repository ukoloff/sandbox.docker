name: rclone-nv

services:
  http:
    image: rclone/rclone:latest
    command:
      - serve
      - http
      - /etc
      - --addr
      - :80
      - --dir-cache-time
      - 1s
    ports:
      - 1488:80

  www:
    image: rclone/rclone:latest
    depends_on:
      sidecar:
        condition: service_completed_successfully
    # privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    devices:
      - /dev/fuse
    volumes:
      - type: volume
        source: config
        target: /config/rclone
        volume:
          subpath: sync/Rclone/named-v/config/www
    command:
      - mount
      - "http:"
      - /mnt
      - --allow-non-empty
      - --dir-cache-time
      - 1s
      - --vfs-cache-mode
      - full

  sidecar:
    image: ukoloff/sidecar:js
    volumes:
      - config:/config
    working_dir: /config
    environment:
      SIDECAR_GIT_URL: ukoloff/sandbox.docker/sync/Rclone/named-v/config#rClone

volumes:
  config:
