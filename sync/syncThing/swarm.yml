services:
  syncthing:
    image: syncthing/syncthing
    deploy:
      mode: global
    networks:
      default:
        aliases:
          - sthng
    env_file:
      - .env
    volumes:
      - config:/var/syncthing
      - folder:/folders/folder
    labels: &vscode-container-explorer
      com.docker.compose.project: SyncThing@swarm

  dev:
    image: ukoloff/dev:js
    labels: *vscode-container-explorer
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == swarm01

    init: true
    env_file:
      - .env
    working_dir: /repo
    command:
      - sleep
      - infinity
    networks:
      - default
      - world

volumes:
  config:
  folder:

networks:
  default:
    internal: true
  world:
